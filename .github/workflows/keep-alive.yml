name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
  workflow_dispatch:  # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          echo "Pinging app"
          response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$APP_URL")
          echo "HTTP status: $response"
          # Accept any response from Streamlit's servers — even redirects count as traffic
          if [ -z "$response" ] || [ "$response" = "000" ]; then
            echo "::error::No response from server (status: $response)"
            exit 1
          fi
          echo "Ping registered successfully"
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}